<html>
  <head>
    <title>Minimal PhysFS Tester</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
  <script type="importmap">
    {
      "imports": {
        "@easywasm/wasi": "https://esm.sh/@easywasm/wasi",
        "fflate": "https://esm.sh/fflate/esm/browser.js"
      }
    }
  </script>
  <script type="module">
    import WasiPreview1 from "@easywasm/wasi";
    import fflatefs from "./fflatefs.js";
    import wasmLoader from "./raycart.mjs";

    // Takes a zip-file with main.wasm and loads it with raylib imports
    // set any emscripten-options you want in options
    // arguments/preRun will merge
    async function loadCart(zipFile, options = {}) {
      const zipBytes = new Uint8Array(
        await fetch(zipFile).then((r) => r.arrayBuffer()),
      );
      const fs = await fflatefs(zipBytes);
      return wasmLoader({
        ...options,
        arguments: options?.arguments || [zipFile],
        preRun(mod) {
          mod.FS.writeFile(zipFile, zipBytes);
          mod.wasi_snapshot_preview1 = new WasiPreview1({ fs });
          options?.preRun && options.preRun(mod);
        },
      });
    }

    const canvas = document.getElementById("canvas");
    const host = await loadCart("basic_window_c.zip", { canvas });
  </script>
</html>
