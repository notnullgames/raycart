<html>
  <head>
    <title>Minimal PhysFS Tester</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: rgba(245, 245, 245, 255); /* RAYWHITE */
        background: black;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas" />
  </body>
  <script type="importmap">
    {
      "imports": {
        "@easywasm/wasi": "https://esm.sh/@easywasm/wasi",
        "fflate": "https://esm.sh/fflate/esm/browser.js"
      }
    }
  </script>
  <script type="module">
    import WasiPreview1 from '@easywasm/wasi'
    import fflatefs from './fflatefs.js'
    import wasmLoader from './raycart.mjs'

    // Takes a zip-file with main.wasm and loads it with raylib imports
    // set any emscripten-options (canvas is an important one!) in options
    // arguments/preRun will merge
    async function loadCart(zipFile, options = {}) {
      const zipBase = zipFile.split('/').pop()
      const zipBytes = new Uint8Array(await fetch(zipFile).then((r) => r.arrayBuffer()))
      const fs = await fflatefs(zipBytes)
      return wasmLoader({
        ...options,
        arguments: options?.arguments || [zipBase],
        preRun(mod) {
          mod.FS.writeFile(zipBase, zipBytes)
          mod.wasi_snapshot_preview1 = new WasiPreview1({ fs })
          options?.preRun && options.preRun(mod)
        }
      })
    }

    // handle #cart URL
    let cart = 'textures_logo_c'
    if (document.location.hash) {
      cart = document.location.hash.slice(1)
    }
    window.addEventListener('hashchange', () => {
      // reload is required to clear it out
      document.location.reload()
    })

    const host = await loadCart(`carts/${cart}.zip`, { canvas: document.getElementById('canvas') })
    console.log(host)
  </script>
</html>
