<html>
  <head>
    <title>RayCart Demo</title>
  </head>
  <body>
    <canvas id="canvas" />
  </body>
</html>

<script type="importmap">
  {
    "imports": {
      "@easywasm/wasi": "https://esm.sh/@easywasm/wasi"
    }
  }
</script>

<script type="module">
  import raycart from "./raycart.js";

  const cartBytes = new Uint8Array(
    await fetch("carts/basic_window_c.zip").then((r) => r.arrayBuffer()),
  );
  const host = await raycart(
    [["basic_window_c.zip", cartBytes]],
    document.getElementById("canvas"),
  );

  console.log(host);
</script>
