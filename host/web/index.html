<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>raycart</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #111;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        font-family: monospace;
        color: #aaa;
        gap: 10px;
      }
      canvas {
        display: block;
        border: 1px solid #333;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #status {
        font-size: 13px;
      }
      ul {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        max-width: 600px;
      }
      ul a {
        display: block;
        padding: 4px 10px;
        border: 1px solid #333;
        border-radius: 4px;
        color: #aaa;
        text-decoration: none;
        font-size: 13px;
        transition: border-color 0.15s, color 0.15s;
      }
      ul a:hover {
        border-color: #888;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="status">loading…</div>
    <ul>
      <li><a href="?cart=basic.wasm">basic</a></li>
      <li><a href="?cart=core_basic_window.wasm">core_basic_window</a></li>
      <li><a href="?cart=models_loading_gltf.zip">models_loading_gltf</a></li>
      <li><a href="?cart=shapes_colors_palette.wasm">shapes_colors_palette</a></li>
      <li><a href="?cart=tetris.wasm">tetris</a></li>
      <li><a href="?cart=textures_logo.zip">textures_logo</a></li>
    </ul>
    <!--this makes it so you don't need build-system, but these are also in package.json, if you have one -->
    <script type="importmap">
      {
        "imports": {
          "@easywasm/wasi": "https://esm.sh/@easywasm/wasi",
          "fflate": "https://esm.sh/fflate/esm/browser.js"
        }
      }
    </script>
    <script type="module">
      import loadRaycart from './index.js'

      const cartName = new URLSearchParams(location.search).get('cart') ?? 'basic.wasm'
      loadRaycart(new URL(`./carts/${cartName}`, import.meta.url))
    </script>
  </body>
</html>
